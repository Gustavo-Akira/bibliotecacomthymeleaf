name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Build and Test

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15

        env:
          POSTGRES_DB: bibliotecath
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 123456

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d biblioteca"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres -d biblioteca; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Run tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/biblioteca
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: 123456
        run: ./mvnw test